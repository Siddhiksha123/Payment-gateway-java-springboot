spring.application.name=LearningRESTAPIs

# spring.application.name=TestingApp

# Port configuration
# server.port=8081

# DB configuration
# here postgres is our DB name
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
# username that you have given while installing postgres
spring.datasource.username=postgres
# password that you have specified while installing postgres
spring.datasource.password=postgres
# This will create schema on running your application and will also drop all schemas once you stop your application
spring.jpa.hibernate.ddl-auto=update
# To see all the sql statements run by hibernate
spring.jpa.show-sql=true
# Format the hibernate queries, statements
spring.jpa.properties.hibernate.format_sql=true

# Swagger Ui - http://localhost:8080/swagger-ui/index.html